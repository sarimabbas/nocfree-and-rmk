name: Firmware checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [reclaimed-softdevice, factory-layout]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust target and formatter
        run: rustup target add thumbv7em-none-eabihf && rustup component add rustfmt
      - name: Install Arm compiler and newlib
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Host tests and all firmware roles
        env:
          LAYOUT: ${{ matrix.layout }}
        run: |
          if [ "$LAYOUT" = factory-layout ]; then
            ./scripts/check.sh --backlight-active-high
          else
            ./scripts/check.sh --reclaimed-softdevice
          fi

  backlight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        polarity: [low, high]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust target and formatter
        run: rustup target add thumbv7em-none-eabihf && rustup component add rustfmt
      - name: Install Arm compiler and newlib
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Check optional backlight and all roles
        env:
          POLARITY: ${{ matrix.polarity }}
        run: ./scripts/check.sh --reclaimed-softdevice --backlight-active-${POLARITY}

  runtime-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust target and formatter
        run: rustup target add thumbv7em-none-eabihf && rustup component add rustfmt
      - name: Install Arm compiler and newlib
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Check Vial, runtime recovery and all roles
        run: ./scripts/check.sh --reclaimed-softdevice --backlight-active-high --runtime-recovery
      - name: Build opt-in left blue status indicator
        working-directory: firmware
        run: cargo build --locked --release --bin nocfree-rmk --target thumbv7em-none-eabihf --no-default-features --features defmt-logging,left,mac-keymap,runtime-recovery,reclaimed-softdevice,backlight-active-high,status-led
      - name: Build interrupt-driven scanner for both halves
        working-directory: firmware
        run: |
          for role in left right; do
            cargo build --locked --release --bin nocfree-rmk --target thumbv7em-none-eabihf --no-default-features --features defmt-logging,${role},mac-keymap,runtime-recovery,reclaimed-softdevice,backlight-active-high,async-scanner
          done

  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libudev-dev libvulkan-dev zip
      - name: Install pinned desktop toolchain
        working-directory: desktop
        run: rustup show active-toolchain
      - name: Desktop tests and lint
        working-directory: desktop
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check
      - name: Public synthetic image and package guards
        run: python -m unittest discover -s tests -v
      - name: Vial preset guards
        run: python firmware/presets/test_presets.py
      - name: Companion packaging and notice guards
        run: python -m unittest discover -s scripts -p 'test_companion_*.py' -v
