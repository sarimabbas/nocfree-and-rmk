name: Draft desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string
      firmware_source_tag:
        description: Release tag holding companion-firmware.zip, including this release draft
        required: true
        type: string
      firmware_zip_sha256:
        description: SHA256 of the firmware ZIP
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  firmware-input:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Stage firmware from the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_TAG: ${{ inputs.firmware_source_tag }}
          FIRMWARE_SHA256: ${{ inputs.firmware_zip_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FIRMWARE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$FIRMWARE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          gh release download "$FIRMWARE_TAG" --repo "$GITHUB_REPOSITORY" --pattern companion-firmware.zip --dir "$RUNNER_TEMP/firmware-input"
          echo "$FIRMWARE_SHA256  $RUNNER_TEMP/firmware-input/companion-firmware.zip" | sha256sum --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-firmware-input
          path: ${{ runner.temp }}/firmware-input/companion-firmware.zip
          if-no-files-found: error
          retention-days: 1

  build:
    needs: firmware-input
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install desktop toolchain
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f1)"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache desktop dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          workspaces: desktop -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify requested and project versions
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --manifest-path desktop/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "nocfree-companion"))')"
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REQUESTED_VERSION" == "$cargo_version" ]]
          firmware_version="$(python3 -c 'import tomllib; print(tomllib.load(open("firmware/Cargo.toml", "rb"))["package"]["version"])')"
          [[ "$REQUESTED_VERSION" == "$firmware_version" ]]
          [[ "$(uname -m)" == arm64 ]]
          tag="v${REQUESTED_VERSION}"
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != true ]]; then
              echo "Version $tag is already published; release versions are immutable." >&2
              exit 1
            fi
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag belongs to another source commit." >&2
              exit 1
            fi
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test Companion
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --check
          cargo test --manifest-path desktop/Cargo.toml --locked --lib
          cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets -- -D warnings

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: companion-firmware-input
          path: ${{ runner.temp }}/firmware-input
      - name: Validate reviewed firmware input
        env:
          FIRMWARE_SHA256: ${{ inputs.firmware_zip_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FIRMWARE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          python3 scripts/unpack_companion_release.py --input "$RUNNER_TEMP/firmware-input/companion-firmware.zip" --sha256 "$FIRMWARE_SHA256" --output dist/companion-firmware
          python3 -c 'import json,tomllib; assert json.load(open("dist/companion-firmware/manifest.json"))["version"] == tomllib.load(open("desktop/Cargo.toml", "rb"))["package"]["version"]'

      - name: Validate publication notices and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/companion_notices.py "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"
          python3 scripts/companion_notices.py "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md" --strict --check


      - name: Build unsigned app with pinned firmware guard
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./desktop/package-macos.sh

      - name: Pack unsigned app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-input"
          cp "$RUNNER_TEMP/firmware-input/companion-firmware.zip" "$RUNNER_TEMP/release-input/companion-firmware.zip"
          ditto -c -k --keepParent "dist/NocFree RMK Companion.app" "$RUNNER_TEMP/release-input/nocfree-rmk-companion-unsigned.zip"
          cat > "$RUNNER_TEMP/release-input/${VERSION}.md" <<'NOTES'
          Companion shows the battery level for both keyboard halves over USB, Bluetooth and the dongle.

          The app includes firmware for ANSI, ISO, JIS and KR keyboards.
          NOTES

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nocfree-rmk-companion-unsigned-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release-input/
          if-no-files-found: error
          retention-days: 1

  portable:
    needs: firmware-input
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
          - runner: windows-2025
            platform: windows
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libudev-dev libvulkan-dev bluez zip
      - name: Install desktop toolchain
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f1)"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache desktop dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          workspaces: desktop -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify native release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cargo_version="$(cargo metadata --manifest-path desktop/Cargo.toml --locked --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "nocfree-companion"))')"
          [[ "$REQUESTED_VERSION" == "$cargo_version" ]]
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Test native Companion
        shell: bash
        run: |
          cargo test --manifest-path desktop/Cargo.toml --locked --lib
          cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets -- -D warnings
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: companion-firmware-input
          path: ${{ runner.temp }}/firmware-input
      - name: Validate reviewed firmware input
        env:
          FIRMWARE_SHA256: ${{ inputs.firmware_zip_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FIRMWARE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          python scripts/unpack_companion_release.py --input "$RUNNER_TEMP/firmware-input/companion-firmware.zip" --sha256 "$FIRMWARE_SHA256" --output dist/companion-firmware
      - name: Build native archive
        shell: bash
        run: python desktop/package-portable.py
      - name: Stage archives only
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/portable"
          case "$PLATFORM" in
            windows) extension=zip ;;
            linux) extension=tar.gz ;;
            *) exit 1 ;;
          esac
          archive="dist/nocfree-rmk-companion-${VERSION}-${PLATFORM}-x86_64.${extension}"
          test -s "$archive"
          test -s "${archive}.sha256"
          cp "$archive" "${archive}.sha256" "$RUNNER_TEMP/portable/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nocfree-rmk-companion-portable-${{ matrix.platform }}
          path: ${{ runner.temp }}/portable/
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: [build, portable]
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nocfree-rmk-companion-unsigned-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/input

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nocfree-rmk-companion-portable-*
          merge-multiple: true
          path: ${{ runner.temp }}/portable

      - name: Unpack unsigned app
        run: ditto -x -k "$RUNNER_TEMP/input/nocfree-rmk-companion-unsigned.zip" "$RUNNER_TEMP/package"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/nocfree-rmk-companion-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]]
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign app
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/package/NocFree RMK Companion.app"
          sign=(--force --sign "$SIGN_IDENTITY" --options runtime --timestamp)
          codesign "${sign[@]}" "$app/Contents/MacOS/nocfree-battery-bluetooth"
          codesign "${sign[@]}" "$app/Contents/MacOS/nocfree-companion"
          codesign "${sign[@]}" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Notarize and staple
        env:
          APPLE_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_API_PRIVATE_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/package/NocFree RMK Companion.app"
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          submission="$RUNNER_TEMP/nocfree-rmk-companion-notarization.zip"
          archive="$RUNNER_TEMP/nocfree-rmk-companion-${VERSION}-macos-arm64.zip"

          printf '%s' "$APPLE_API_PRIVATE_KEY_P8" | base64 -D > "$key"
          chmod 600 "$key"
          while IFS= read -r line; do
            [[ -z "$line" ]] || echo "::add-mask::$line"
          done < "$key"

          ditto -c -k --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          ditto -c -k --keepParent "$app" "$archive"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          checksum="${archive}.sha256"
          (cd "$(dirname "$archive")" && shasum -a 256 "$(basename "$archive")" > "$(basename "$checksum")")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "CHECKSUM=$checksum" >> "$GITHUB_ENV"

      - name: Remove Apple credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "${SIGNING_KEYCHAIN:-$RUNNER_TEMP/nocfree-rmk-companion-signing.keychain-db}" 2>/dev/null || true
          security list-keychains -d user -s login.keychain-db
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/nocfree-rmk-companion-notarization.zip"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/latest"
          latest_assets=()
          for platform in macos-arm64 windows-x86_64 linux-x86_64; do
            case "$platform" in
              macos-arm64) source="$ARCHIVE"; extension=zip ;;
              windows-x86_64) source="$RUNNER_TEMP/portable/nocfree-rmk-companion-${VERSION}-${platform}.zip"; extension=zip ;;
              linux-x86_64) source="$RUNNER_TEMP/portable/nocfree-rmk-companion-${VERSION}-${platform}.tar.gz"; extension=tar.gz ;;
            esac
            name="nocfree-rmk-companion-${platform}.${extension}"
            cp "$source" "$RUNNER_TEMP/latest/$name"
            (cd "$RUNNER_TEMP/latest" && shasum -a 256 "$name" > "$name.sha256")
            latest_assets+=("$RUNNER_TEMP/latest/$name" "$RUNNER_TEMP/latest/$name.sha256")
          done
          tag="v${VERSION}"
          assets=("$ARCHIVE" "$CHECKSUM"
            "$RUNNER_TEMP/portable/nocfree-rmk-companion-${VERSION}-windows-x86_64.zip"
            "$RUNNER_TEMP/portable/nocfree-rmk-companion-${VERSION}-windows-x86_64.zip.sha256"
            "$RUNNER_TEMP/portable/nocfree-rmk-companion-${VERSION}-linux-x86_64.tar.gz"
            "$RUNNER_TEMP/portable/nocfree-rmk-companion-${VERSION}-linux-x86_64.tar.gz.sha256"
            "${latest_assets[@]}")
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [[ "$draft" == true ]] || { echo "Release $tag is already published." >&2; exit 1; }
            has_firmware="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq 'any(.assets[]; .name == "companion-firmware.zip")')"
            if [[ "$has_firmware" == true ]]; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern companion-firmware.zip --dir "$RUNNER_TEMP/staged-firmware"
              cmp "$RUNNER_TEMP/staged-firmware/companion-firmware.zip" "$RUNNER_TEMP/input/companion-firmware.zip"
            else
              assets+=("$RUNNER_TEMP/input/companion-firmware.zip")
            fi
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease=false \
              --target "$GITHUB_SHA" --title "NocFree RMK Companion ${VERSION}" \
              --notes-file "$RUNNER_TEMP/input/${VERSION}.md"
          else
            gh release create "$tag" "${assets[@]}" "$RUNNER_TEMP/input/companion-firmware.zip" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "NocFree RMK Companion ${VERSION}" --draft \
              --notes-file "$RUNNER_TEMP/input/${VERSION}.md"
          fi
