version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: rynk
      - dependency-name: rynk-usb
  - package-ecosystem: cargo
    directory: /firmware
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: rmk
      - dependency-name: embassy-nrf
  - package-ecosystem: cargo
    directory: /crates/nocfree-input
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
