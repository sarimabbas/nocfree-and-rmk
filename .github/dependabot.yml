version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /firmware
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
