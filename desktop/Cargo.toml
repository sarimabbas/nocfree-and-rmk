[package]
name = "nocfree-companion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-unofficial", version = "=1.14.2" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.14.2", features = ["font-kit"] }
gpuikit = { version = "=0.9.0", features = ["runtime_shaders"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rynk = { git = "https://github.com/sarimabbas/rmk-nocfree", rev = "b41bd7caa7de67a47f6e7380519b730630f16152" }
rynk-usb = { git = "https://github.com/sarimabbas/rmk-nocfree", rev = "b41bd7caa7de67a47f6e7380519b730630f16152" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
nusb = "=0.2.7"

[profile.dev]
debug = 0
