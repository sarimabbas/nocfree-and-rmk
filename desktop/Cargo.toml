[package]
name = "nocfree-companion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.7.0"
plist = "1"
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rynk = { git = "https://github.com/sarimabbas/rmk-nocfree", rev = "b41bd7caa7de67a47f6e7380519b730630f16152" }
rynk-usb = { git = "https://github.com/sarimabbas/rmk-nocfree", rev = "b41bd7caa7de67a47f6e7380519b730630f16152" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
nusb = { version = "=0.2.7", features = ["tokio"] }
hidapi = { version = "=2.6.7", default-features = false, features = ["macos-shared-device", "linux-native-basic-udev", "windows-native"] }
statig = "=0.4.1"

[profile.dev]
debug = 0

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.2.2", default-features = false, features = ["NSWindow", "NSView", "NSResponder"] }
objc2-foundation = { version = "=0.2.2", default-features = false }
raw-window-handle = "=0.6.2"
