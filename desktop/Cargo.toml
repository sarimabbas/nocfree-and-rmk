[package]
name = "nocfree-companion"
version = "1.1.0"
edition = "2024"
publish = false

[features]
firmware-trial = []

[dependencies]
gpui-kit = "=0.7.0"
plist = "1"
semver = "=1.0.28"
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = ["rustls-tls-native-roots", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rynk = { git = "https://github.com/rmk-rs/rmk", rev = "434ab4d7d29d8e9ba689837358c8a44996ba38cc" }
rynk-usb = { git = "https://github.com/rmk-rs/rmk", rev = "434ab4d7d29d8e9ba689837358c8a44996ba38cc" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
nusb = { version = "=0.2.7", features = ["tokio"] }
hidapi = { version = "=2.6.7", default-features = false, features = ["macos-shared-device", "linux-native-basic-udev", "windows-native"] }
statig = "=0.4.1"

[profile.dev]
debug = 0

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.2.2", default-features = false, features = ["NSWindow", "NSView", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false }
raw-window-handle = "=0.6.2"
