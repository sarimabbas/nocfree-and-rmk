[package]
name = "nocfree-usb-startup-review"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dev-dependencies]
embassy-usb = "=0.6.0"
embassy-time = { version = "=0.5.1", features = ["std"] }

[[test]]
name = "framework_dfu"
path = "framework_dfu.rs"

[[test]]
name = "stage_trace"
path = "stage_trace.rs"

# The imported production trace has a right-role USB-descriptor exclusion.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("right"))'] }

[[test]]
name = "watchdog_recovery"
path = "watchdog_recovery.rs"
