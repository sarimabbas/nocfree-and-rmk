[package]
name = "nocfree-rmk"
version = "0.1.1"
edition = "2024"
license = "MIT"
default-run = "nocfree-rmk"

[features]
layout-iso = ["nocfree-input/layout-iso"]
layout-jis = ["nocfree-input/layout-jis"]
layout-kr = ["nocfree-input/layout-kr"]
default = ["defmt-logging", "runtime-recovery"]
# Register-only early guard, adopted and fed by RMK in normal operation.
startup-watchdog = ["rmk/watchdog"]
# Normal production recovery: local USB DETACH and one startup/runtime watchdog.
runtime-recovery = ["startup-watchdog", "rmk/runtime_dfu", "embassy-nrf/preserve-uicr"]
# Normal builds use RMK defmt; --no-default-features callers select this explicitly.
defmt-logging = ["rmk/defmt"]
# Optional framework CDC logger; choose instead of defmt-logging.
usb-log = ["rmk/usb_log", "dep:log", "log/max_level_warn", "log/release_max_level_warn"]
# Raw battery ADC samples through the RMK CDC logger.
battery-adc-diagnostic = ["rmk/usb_log", "dep:log", "log/max_level_error", "log/release_max_level_error"]
# Mac media keys in the default keymap.
mac-keymap = []
# Wait for the expander interrupt while the scanner is idle.
async-scanner = ["rmk/async_matrix", "dep:embedded-hal"]
# Left blue connection indicator.
status-led = ["rmk/status_led", "embassy-nrf/nfc-pins-as-gpio", "embassy-nrf/preserve-uicr"]
# Backlight PWM; select the board polarity below.
backlight = ["rmk/backlight"]
backlight-active-low = ["backlight"]
backlight-active-high = ["backlight"]
# Application at 0x1000; the receiver keeps the factory layout.
reclaimed-softdevice = []
left = ["rmk/usb_power_awake", "rmk/split", "rmk/dongle", "rmk/adafruit_bl", "rmk/vial", "rmk/host_lock", "rmk/vial_battery"]
right = ["rmk/usb_power_awake", "rmk/split", "rmk/adafruit_bl"]
receiver = ["rmk/dongle", "rmk/adafruit_bl", "rmk/vial", "rmk/host_lock"]
[dependencies]
log = { version = "0.4", optional = true }
rmk = { git = "https://github.com/sarimabbas/rmk-nocfree", rev = "108067bf3577e5b46e9436522c6b805d2cf36fbd", default-features = false, features = ["storage", "nrf52833_ble"] }
nocfree-input = { path = "../crates/nocfree-input" }
nrf-sdc = { version = "0.4", features = ["defmt", "peripheral", "central", "nrf52833"] }
nrf-mpsl = { version = "0.4", features = ["defmt", "critical-section-impl", "nrf52833"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52833", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embedded-hal-async = "1"
embedded-hal = { version = "1", optional = true }
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["set-vtor"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
debug = 2

# Published 0.11.0 source with nRF52833 SET_ADDRESS handling and buffered PWM updates.
[patch.crates-io]
embassy-nrf = { git = "https://github.com/sarimabbas/embassy-nrf-nocfree", rev = "ec44c260354cfd31f3bb6f0a05f82e7f58e8cdff" }

[build-dependencies]
serde_json = "1"
xz2 = "0.1"
