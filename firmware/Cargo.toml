[package]
name = "nocfree-rmk"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "nocfree-rmk"

[[bin]]
name = "recovery-probe"
path = "src/bin/recovery-probe.rs"
required-features = ["recovery-probe"]

[[bin]]
name = "input-probe"
path = "src/bin/input-probe.rs"
required-features = ["input-probe"]

[[bin]]
name = "bootloader-inspect"
path = "src/bin/bootloader-inspect.rs"
required-features = ["bootloader-inspect"]
[[bin]]
name = "watchdog-rescue-probe"
path = "src/bin/watchdog-rescue-probe.rs"
required-features = ["watchdog-rescue-probe"]

[features]
default = ["defmt-logging", "runtime-recovery"]
# LEFT-only raw watchdog hang proof; reserves marker-free startup entry.
watchdog-rescue-probe = ["reclaimed-softdevice", "dep:nrf-pac"]
# Register-only early guard, adopted and fed by RMK in normal operation.
startup-watchdog = ["rmk/watchdog"]
# Normal production recovery: local USB DETACH and one startup/runtime watchdog.
runtime-recovery = ["startup-watchdog", "rmk/runtime_dfu", "embassy-nrf/preserve-uicr"]
# Normal builds use RMK defmt; --no-default-features callers select this explicitly.
defmt-logging = ["rmk/defmt"]
# Optional framework CDC logger; choose instead of defmt-logging.
usb-log = ["rmk/usb_log", "dep:log", "log/max_level_warn", "log/release_max_level_warn"]
# Temporary read-only raw sample logging through the existing RMK CDC logger.
battery-adc-diagnostic = ["rmk/usb_log", "dep:log", "log/max_level_error", "log/release_max_level_error"]
# Interim compile-time Mac media row; runtime OS profiles are a later milestone.
mac-keymap = []
# Expander interrupt idle scanning; opt-in until each half passes wake acceptance.
async-scanner = ["rmk/async_matrix", "dep:embedded-hal"]
# LEFT blue status GPIO; opt-in until physical polarity/behavior acceptance.
status-led = ["rmk/status_led", "embassy-nrf/nfc-pins-as-gpio", "embassy-nrf/preserve-uicr"]
# Optical trial only: shared red channel is sink-only and released on USB.
status-led-mixing = ["status-led", "rmk/status_led_mix", "dep:embedded-hal"]
# Opt-in until the board's physical backlight polarity is verified.
backlight = ["rmk/backlight"]
backlight-active-low = ["backlight"]
backlight-active-high = ["backlight"]
# Explicit migration: replaces resident S140; never a normal update.
reclaimed-softdevice = []
# Optional existing-bootloader recovery window; changes USB cold-start UX.
usb-recovery-first = []
# Local held-key recovery before RMK starts; leaves the factory bootloader intact.
application-recovery-shim = []
# Temporary static USB/BLE manufacturer outcome; no additional transport.
startup-recovery-diagnostic = ["application-recovery-shim"]
# Experimental initialized-HAL stage before RMK; no bootloader changes.
usb-rescue-startup = ["dep:embassy-usb", "embassy-nrf/preserve-uicr", "defmt-logging"]
# Temporary RAM-only normal USB manufacturer evidence; no timing changes.
usb-rescue-diagnostic = ["usb-rescue-startup"]
# Stage-zero USB-only probe; uses the existing Adafruit reset request.
recovery-probe = ["dep:embassy-usb", "rmk/adafruit_bl"]
# Left-only lower-layout trial, reusing the USB recovery probe without radio tasks.
migration-probe = ["recovery-probe", "reclaimed-softdevice", "usb-recovery-first"]
# Left-only reset-entry heartbeat; returns to existing DFU before RAM initialization.
migration-entry-probe = ["migration-probe"]
# Stage returns after executor startup or unchanged HAL initialization, respectively.
migration-runtime-probe = ["migration-probe"]
migration-hal-probe = ["migration-probe"]
# Returns after HAL initialization or USB construction with the serial-only request.
migration-hal-serial-probe = ["migration-probe"]
migration-usb-build-serial-probe = ["migration-probe"]
# Matched reset control and framework USB callback boundaries for startup observations.
migration-hal-neutral-probe = ["migration-probe"]
migration-usb-enabled-serial-probe = ["migration-probe"]
migration-usb-configured-serial-probe = ["migration-probe"]
migration-usb-reset-serial-probe = ["migration-probe"]
# SET_ADDRESS dispatch, before the framework calls accept_set_address.
migration-usb-addressed-serial-probe = ["migration-probe"]
# Right-local USB typing diagnostic, with independent CDC update entry.
input-probe = ["dep:embassy-usb", "rmk/adafruit_bl"]
# Temporary read-only upper-flash/MBR/UICR inspection, retaining USB-first recovery.
bootloader-inspect = ["dep:embassy-usb", "reclaimed-softdevice", "usb-recovery-first", "embassy-nrf/preserve-uicr"]
left = ["rmk/usb_power_awake", "rmk/split", "rmk/dongle", "rmk/adafruit_bl", "rmk/vial", "rmk/host_lock", "rmk/vial_battery"]
right = ["rmk/usb_power_awake", "rmk/split", "rmk/adafruit_bl"]
receiver = ["rmk/dongle", "rmk/adafruit_bl", "rmk/vial", "rmk/host_lock"]
[dependencies]
nrf-pac = { version = "=0.4.0", features = ["nrf52833", "rt"], optional = true }
log = { version = "0.4", optional = true }
embassy-usb = { version = "=0.6.0", optional = true }
rmk = { git = "https://github.com/sarimabbas/rmk-nocfree", rev = "33214e095a86e21bac6184ab9e4d3565ba72a849", default-features = false, features = ["storage", "nrf52833_ble"] }
nocfree-input = { path = "../crates/nocfree-input" }
nrf-sdc = { version = "0.4", features = ["defmt", "peripheral", "central", "nrf52833"] }
nrf-mpsl = { version = "0.4", features = ["defmt", "critical-section-impl", "nrf52833"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52833", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embedded-hal-async = "1"
embedded-hal = { version = "1", optional = true }
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["set-vtor"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
debug = 2

# Published 0.11.0 source with nRF52833 SET_ADDRESS handling and buffered PWM updates.
[patch.crates-io]
embassy-nrf = { git = "https://github.com/sarimabbas/embassy-nrf-nocfree", rev = "ec44c260354cfd31f3bb6f0a05f82e7f58e8cdff" }

[build-dependencies]
serde_json = "1"
xz2 = "0.1"
