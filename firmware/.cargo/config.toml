[build]
target = "thumbv7em-none-eabihf"
[target.thumbv7em-none-eabihf]
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=--nmagic", "-C", "link-arg=-Tdefmt.x"]

[env]
KEYBOARD_TOML_PATH = { value = "keyboard.toml", relative = true }
DEFMT_LOG = "off"
# Keep the existing MTU; derive notification buffers from its ATT payload limit.
TROUBLE_HOST_DEFAULT_PACKET_POOL_MTU = "251"
