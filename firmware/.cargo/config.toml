[build]
target = "thumbv7em-none-eabihf"
[target.thumbv7em-none-eabihf]
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=--nmagic", "-C", "link-arg=-Tdefmt.x"]

[env]
KEYBOARD_TOML_PATH = { value = "keyboard.toml", relative = true }
DEFMT_LOG = "off"
# Enabled split, HID and SMP messages fit; Rynk chunks configuration traffic.
# Keep queue depths unchanged. Re-audit payload and stack bounds on upgrades.
TROUBLE_HOST_DEFAULT_PACKET_POOL_MTU = "128"
