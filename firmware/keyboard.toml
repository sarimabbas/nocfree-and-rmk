[rmk]
debounce_time = 5
combo_max_num = 8
fork_max_num = 0
morse_max_num = 4
morse_profile_max_num = 1
macro_max_num = 8
macro_space_size = 256
split_peripherals_num = 1
# Native central idle timeout.
split_central_sleep_timeout_seconds = 1800
ble_profiles_num = 5
[split]
connection = "ble"
[split.central]
rows = 1
cols = 37
row_offset = 0
col_offset = 0
battery_adc_pin = "P0_04"
battery_user_description = "Left"
[split.central.matrix]
[[split.peripheral]]
rows = 1
cols = 47
row_offset = 0
col_offset = 37
battery_adc_pin = "P0_04"
battery_user_description = "Right"
[split.peripheral.matrix]

# Board backlight and status indicator subscribe to native RMK events.
[event.action]
subs = 1
[event.connection_status_change]
subs = 2
[event.sleep_state]
subs = 3
[event.custom_message]
subs = 3
[event.peripheral_connected]
subs = 3
[event.central_connected]
subs = 2
